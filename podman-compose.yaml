services:
  db:
    image: docker.io/library/postgres:16-alpine
    container_name: ledgerly-db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-ledgerly_db}
      POSTGRES_USER: ${DB_USER:-ledgerly}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ledgerly_local_sec_pass}
    ports:
      - "5433:5432"
    volumes:
      - ./scripts/db_setup.sql:/docker-entrypoint-initdb.d/init.sql:Z
      - ledgerly_pgdata:/var/lib/postgresql/data
    extra_hosts:
      - "host.containers.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ledgerly} -d ${DB_NAME:-ledgerly_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: 
      context: .
      dockerfile: Containerfile
    container_name: ledgerly-app
    restart: unless-stopped
    ports:
      - "8501:8501"
    env_file:
      - .env
    extra_hosts:
      - "host.containers.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy 
    volumes:
      - ./src:/app/src:Z
      - ./README.md:/app/README.md:ro,Z
      - ./.streamlit:/app/.streamlit:ro,Z
      - ./assets:/app/assets:ro
      - ./data/imports:/app/data/imports
      
volumes:
  ledgerly_pgdata: